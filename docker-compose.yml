services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: insightflow
      POSTGRES_USER: insightflow
      POSTGRES_PASSWORD: insightflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightflow -d insightflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      INSIGHTFLOW_FRONTEND_ORIGIN: http://localhost:3000
      INSIGHTFLOW_DATABASE_URL: postgresql+psycopg://insightflow:insightflow@postgres:5432/insightflow
      INSIGHTFLOW_JWT_SECRET: local-docker-development-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - upload_data:/app/.data/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  upload_data:
